validation:
  expected_skill_count: 32
  skill_id_changes: 0
  skill_deletions: 0

checks:
  - .adf/framework/review
  - .adf/templates
  - standards/development
  - standards/migration
  - modules

optional_checks:
  issue_tracking:
    enabled_when_project_config_exists: true
    checks:
      - .adf/framework/integrations/issue-tracking
      - standards/project/issue-tracking.yaml

compatibility:
  issue_tracking_disabled_preserves_v5_behavior: true

gates:
  human_review: required
  verification: required
  traceability: required
