provider: GITHUB
enabled: true

issue:
  creation:
    mode: AI_ASSISTED
    require_human_confirmation: true

workflow:
  TODO: status::todo
  ANALYSIS: status::analysis
  REVIEW: status::review
  DEVELOPMENT: status::development
  VERIFICATION: status::verification
  COMPLETED: CLOSED

labels:
  work_type:
    NEW: adf::new
    CHANGE: adf::change
    MIGRATION: adf::migration

  intent:
    FEATURE: intent::feature
    BUGFIX: intent::bugfix
    SECURITY_FIX: intent::security
    REFACTOR: intent::refactor

rules:
  finding_creates_issue: false
  unknown_creates_issue: false
  review_required_creates_issue: false
  workflow_labels_mutually_exclusive: true
  blocked_preserves_current_stage: true

completion:
  close_issue_when:
    - verification_passed
    - traceability_passed
    - human_approved
